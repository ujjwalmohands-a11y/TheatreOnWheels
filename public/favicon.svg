<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Midnight Obsidian Gradient -->
    <linearGradient id="towBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08060f"/>
      <stop offset="45%" stop-color="#0e0b1c"/>
      <stop offset="100%" stop-color="#17112b"/>
    </linearGradient>

    <!-- Warm Metallic Gold Sheen (Rim) -->
    <linearGradient id="towGoldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe8a3"/>
      <stop offset="35%" stop-color="#d49b42"/>
      <stop offset="70%" stop-color="#8a5e1e"/>
      <stop offset="100%" stop-color="#f8c368"/>
    </linearGradient>

    <!-- Vibrant Luminous Amber-Gold (Cinema Wheel & Rays) -->
    <linearGradient id="towGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5cc"/>
      <stop offset="28%" stop-color="#f5bf53"/>
      <stop offset="75%" stop-color="#d98926"/>
      <stop offset="100%" stop-color="#ff6b00"/>
    </linearGradient>

    <!-- Projector Beam Warm Atmospheric Glow -->
    <radialGradient id="towBeamGrad" cx="0%" cy="50%" r="100%">
      <stop offset="0%" stop-color="#ffb347" stop-opacity="0.5"/>
      <stop offset="45%" stop-color="#ff7b00" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ff5500" stop-opacity="0"/>
    </radialGradient>

    <!-- Core Ember Hub Glow -->
    <radialGradient id="towHub" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#ffe17d"/>
      <stop offset="65%" stop-color="#ff9100"/>
      <stop offset="100%" stop-color="#d94b00"/>
    </radialGradient>

    <!-- Ambient Core Radiance -->
    <radialGradient id="towAmbient" cx="42%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff9d26" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ff9d26" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Squircle Base for High Contrast on both Light & Dark Tabs -->
  <rect width="64" height="64" rx="16" fill="url(#towBg)"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#towAmbient)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="url(#towGoldRim)" stroke-width="1.5"/>

  <!-- Forward Cinema Projection Light Cone -->
  <polygon points="26,32 58,15 58,49" fill="url(#towBeamGrad)"/>
  <line x1="26" y1="32" x2="57" y2="16" stroke="url(#towGold)" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
  <line x1="26" y1="32" x2="57" y2="48" stroke="url(#towGold)" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>

  <!-- Kinetic Cinema Wheel / Projector Reel -->
  <!-- Outer Wheel Rim -->
  <circle cx="26" cy="32" r="16" fill="none" stroke="url(#towGold)" stroke-width="3"/>

  <!-- Concentric Film Track -->
  <circle cx="26" cy="32" r="11" fill="none" stroke="url(#towGoldRim)" stroke-width="1.1" stroke-dasharray="3.2 2"/>

  <!-- Six Turbine Wheel Spokes / Shutter Blades -->
  <g stroke="url(#towGold)" stroke-width="2.2" stroke-linecap="round">
    <line x1="26" y1="16" x2="26" y2="48"/>
    <line x1="12.1" y1="24" x2="39.9" y2="40"/>
    <line x1="12.1" y1="40" x2="39.9" y2="24"/>
  </g>

  <!-- Film Reel Aperture Openings (Obsidian Cutouts) -->
  <circle cx="26" cy="22.5" r="2" fill="#08060f"/>
  <circle cx="26" cy="41.5" r="2" fill="#08060f"/>
  <circle cx="17.8" cy="27.2" r="2" fill="#08060f"/>
  <circle cx="34.2" cy="36.8" r="2" fill="#08060f"/>
  <circle cx="17.8" cy="36.8" r="2" fill="#08060f"/>
  <circle cx="34.2" cy="27.2" r="2" fill="#08060f"/>

  <!-- Center Hub with Glowing Core -->
  <circle cx="26" cy="32" r="5.5" fill="#08060f" stroke="url(#towGold)" stroke-width="1.2"/>
  <circle cx="26" cy="32" r="4.2" fill="url(#towHub)"/>
  <circle cx="26" cy="32" r="1.6" fill="#ffffff"/>

  <!-- 7D Cinematic Light Spark (Focal Beam) -->
  <path d="M51 17 Q51 21 55 21 Q51 21 51 25 Q51 21 47 21 Q51 21 51 17 Z" fill="#ffffff"/>
  <circle cx="51" cy="21" r="1" fill="#ffe082"/>
</svg>
