<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/css/theater.css">
<link rel="stylesheet" href="css/theater.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <a href="/" class="mark" title="Back to Theatre on Wheels home"><span class="mark-7d">7D</span><span class="mark-name">Theater</span></a>
    <p class="now">Now showing <b>Emberwing</b> · demo reel</p>
    <div class="tools">
      <a class="ghost home-btn" href="/" title="Back to main website">← Home</a>
      <button class="ghost" id="snd" type="button" aria-pressed="true">Sound on</button>
      <button class="ghost" id="fs" type="button">Fullscreen</button>
    </div>
  </header>

  <section class="hall" id="hall" aria-label="7D theater demo">
    <div class="stage" id="stage">
      <canvas id="gl" aria-label="Film scene with a dragon"></canvas>
      <svg class="seats" id="seats" viewBox="0 0 1000 110" aria-hidden="true">
        <defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#151119"/><stop offset="1" stop-color="#050407"/></linearGradient></defs>
        <g fill="url(#sg)" stroke="rgba(255,190,120,.2)" stroke-width="1.5">
          <rect x="70" y="40" width="200" height="90" rx="44"/><rect x="120" y="12" width="100" height="44" rx="22"/>
          <rect x="290" y="40" width="200" height="90" rx="44"/><rect x="340" y="12" width="100" height="44" rx="22"/>
          <rect x="510" y="40" width="200" height="90" rx="44"/><rect x="560" y="12" width="100" height="44" rx="22"/>
          <rect x="730" y="40" width="200" height="90" rx="44"/><rect x="780" y="12" width="100" height="44" rx="22"/>
        </g>
        <g fill="#030204" stroke="rgba(255,190,120,.18)" stroke-width="1.5">
          <circle cx="390" cy="46" r="26"/><ellipse cx="390" cy="112" rx="58" ry="40"/>
          <circle cx="830" cy="50" r="24"/><ellipse cx="830" cy="114" rx="54" ry="38"/>
        </g>
      </svg>
      <canvas id="fx"></canvas>
      <div class="vig"></div>
      <div class="curtain l"></div><div class="curtain r"></div>
      <div class="ticket" id="ticket" role="dialog" aria-label="Start the demo">
        <div class="stub"><span>Admit one</span></div>
        <div class="main">
          <p class="eyebrow">Now showing</p>
          <h1>Emberwing</h1>
          <p class="sub">A dragon leaves the screen. Eight effects follow it into the room.</p>
          <dl class="meta"><div><dt>Seat</dt><dd id="tkSeat">B4</dd></div><div><dt>Effects</dt><dd>8</dd></div><div><dt>Seats</dt><dd>16</dd></div></dl>
          <button class="go" id="go" type="button">Take your seat</button>
          <p class="warn">Plays sound. Contains flashing light.</p>
        </div>
      </div>
    </div>
    <div class="rail" id="rail" role="group" aria-label="Effects" style="display:none"></div>
    <div class="bar">
      <button class="show" id="show" type="button" aria-pressed="false"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 1l9 5-9 5z"/></svg><span id="showLbl">Play the show</span></button>
    </div>
  </section>
</div>
<div class="scrim" id="scrim"></div>

<!-- three.js r128, loaded from a CDN. To self-host, download it and change this src. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="/js/theater.js"></script>
<script>
  if (!window.THREE && !document.querySelector('script[src*="theater.js"]')) {
    const s = document.createElement('script');
    s.src = 'js/theater.js';
    document.body.appendChild(s);
  }
</script>
</body>
</html>
